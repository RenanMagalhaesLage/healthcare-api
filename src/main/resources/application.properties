spring.application.name=health-api

server.port=8080

# Database configuration
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/healthcare_api_db
spring.datasource.username=renan
spring.datasource.password=renan

# Hibernate settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
# spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Executa scripts SQL depois da criação das tabelas pelo Hibernate
spring.jpa.defer-datasource-initialization=true
